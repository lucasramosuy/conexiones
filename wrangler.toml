name = "conexiones"
main = "worker.js"
compatibility_date = "2026-09-28"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/conexiones/api/*", "/conexiones"]

# Más específicas que lucasramos.uy/* del Worker proxy; no alterar sus rutas.
[[routes]]
pattern = "lucasramos.uy/conexiones"
zone_name = "lucasramos.uy"

[[routes]]
pattern = "lucasramos.uy/conexiones/*"
zone_name = "lucasramos.uy"
